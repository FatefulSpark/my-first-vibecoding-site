<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Vault & Accomplishment Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --danger: #ef4444;
            --success: #10b981;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --transition: all 0.2s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            background: var(--card-bg);
            padding: 1.5rem 2rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 750;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .tabs {
            display: flex;
            gap: 0.5rem;
            background: var(--bg-color);
            padding: 0.25rem;
            border-radius: calc(var(--radius) - 4px);
        }

        .tab-btn {
            background: transparent;
            border: none;
            padding: 0.5rem 1rem;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.875rem;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 8px;
            transition: var(--transition);
        }

        .tab-btn.active {
            background: var(--card-bg);
            color: var(--primary);
            box-shadow: var(--shadow);
        }

        main {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        @media(min-width: 768px) {
            main {
                grid-template-columns: 350px 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            height: fit-content;
        }

        .card h2 {
            font-size: 1.1rem;
            font-weight: 650;
            margin-bottom: 1rem;
            color: var(--text-main);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 0.35rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input, textarea, select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--text-main);
            background: var(--bg-color);
            transition: var(--transition);
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--card-bg);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1rem;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 2px 4px rgba(79, 70, 229, 0.2);
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .btn-danger {
            background: #fee2e2;
            color: var(--danger);
            box-shadow: none;
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
            width: auto;
        }
        .btn-danger:hover {
            background: #fecaca;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .item-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .item-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 1.25rem;
            box-shadow: var(--shadow);
            transition: var(--transition);
            position: relative;
        }

        .item-card:hover {
            border-color: var(--primary);
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.5rem;
        }

        .item-title {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-main);
        }

        .item-subtitle {
            font-size: 0.875rem;
            color: var(--primary);
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .item-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .item-desc {
            font-size: 0.9rem;
            color: var(--text-main);
            white-space: pre-wrap;
            background: var(--bg-color);
            padding: 0.75rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            font-style: italic;
            background: var(--card-bg);
            border: 1px dashed var(--border-color);
            border-radius: var(--radius);
        }

        .tag {
            display: inline-block;
            background: #e0e7ff;
            color: var(--primary);
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-right: 0.5rem;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>⚡ Resume Vault & Tracker</h1>
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('resumes')">Resumes</button>
                <button class="tab-btn active" onclick="switchTab('accomplishments')" id="accTabBtn">Accomplishments</button>
            </div>
        </header>

        <!-- RESUMES TAB -->
        <div id="resumes-content" class="tab-content active">
            <main>
                <div class="card">
                    <h2>Upload / Add Resume</h2>
                    <form id="resume-form" onsubmit="addResume(event)">
                        <div class="form-group">
                            <label for="res-title">Resume Version Title</label>
                            <input type="text" id="res-title" placeholder="e.g., Software Engineer 2026" required>
                        </div>
                        <div class="form-group">
                            <label for="res-target">Target Role / Industry</label>
                            <input type="text" id="res-target" placeholder="e.g., Frontend Developer" required>
                        </div>
                        <div class="form-group">
                            <label for="res-content">Paste Resume Content (Markdown / Text)</label>
                            <textarea id="res-content" placeholder="Paste your complete resume layout text here..." required></textarea>
                        </div>
                        <button type="submit" class="btn">Save Resume to Vault</button>
                    </form>
                </div>
                <div>
                    <div style="margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center;">
                        <h2 style="font-size: 1.2rem; font-weight: 700;">Stored Resumes</h2>
                    </div>
                    <div id="resume-list" class="item-list">
                        <!-- Populated via JS -->
                    </div>
                </div>
            </main>
        </div>

        <!-- ACCOMPLISHMENTS TAB -->
        <div id="accomplishments-content" class="tab-content">
            <main>
                <div class="card">
                    <h2>Track Accomplishment</h2>
                    <form id="acc-form" onsubmit="addAccomplishment(event)">
                        <div class="form-group">
                            <label for="acc-title">Title / Achievement</label>
                            <input type="text" id="acc-title" placeholder="e.g., Reduced database query latency" required>
                        </div>
                        <div class="form-group">
                            <label for="acc-category">Category</label>
                            <select id="acc-category">
                                <option value="Project">Project</option>
                                <option value="Metric / Impact">Metric / Impact</option>
                                <option value="Leadership">Leadership</option>
                                <option value="Award / Cert">Award / Certification</option>
                                <option value="Skill Gained">Skill Gained</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="acc-date">Date / Period</label>
                            <input type="text" id="acc-date" placeholder="e.g., Q1 2026" required>
                        </div>
                        <div class="form-group">
                            <label for="acc-desc">Details & Metrics</label>
                            <textarea id="acc-desc" placeholder="What did you do? What was the outcome? Use numbers if possible." required></textarea>
                        </div>
                        <button type="submit" class="btn">Log Accomplishment</button>
                    </form>
                </div>
                <div>
                    <div style="margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center;">
                        <h2 style="font-size: 1.2rem; font-weight: 700;">Accomplishments Log</h2>
                    </div>
                    <div id="accomplishment-list" class="item-list">
                        <!-- Populated via JS -->
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        // LocalStorage Data Initialization
        let resumes = JSON.parse(localStorage.getItem('vault_resumes')) || [];
        let accomplishments = JSON.parse(localStorage.getItem('vault_accomplishments')) || [];

        // Tab Switching Logic
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            if (tabName === 'resumes') {
                document.getElementById('resumes-content').classList.add('active');
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
            } else {
                document.getElementById('accomplishments-content').classList.add('active');
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
            }
        }

        // Add Resume
        function addResume(e) {
            e.preventDefault();
            const title = document.getElementById('res-title').value;
            const target = document.getElementById('res-target').value;
            const content = document.getElementById('res-content').value;

            const newResume = {
                id: Date.now(),
                title,
                target,
                content,
                date: new Date().toLocaleDateString()
            };

            resumes.unshift(newResume);
            saveAndRender();
            document.getElementById('resume-form').reset();
        }

        // Delete Resume
        function deleteResume(id) {
            resumes = resumes.filter(r => r.id !== id);
            saveAndRender();
        }

        // Add Accomplishment
        function addAccomplishment(e) {
            e.preventDefault();
            const title = document.getElementById('acc-title').value;
            const category = document.getElementById('acc-category').value;
            const date = document.getElementById('acc-date').value;
            const desc = document.getElementById('acc-desc').value;

            const newAcc = {
                id: Date.now(),
                title,
                category,
                date,
                desc
            };

            accomplishments.unshift(newAcc);
            saveAndRender();
            document.getElementById('acc-form').reset();
        }

        // Delete Accomplishment
        function deleteAccomplishment(id) {
            accomplishments = accomplishments.filter(a => a.id !== id);
            saveAndRender();
        }

        // Persistence and DOM Update
        function saveAndRender() {
            localStorage.setItem('vault_resumes', JSON.stringify(resumes));
            localStorage.setItem('vault_accomplishments', JSON.stringify(accomplishments));
            render();
        }

        function render() {
            // Render Resumes
            const resumeContainer = document.getElementById('resume-list');
            if (resumes.length === 0) {
                resumeContainer.innerHTML = `<div class="empty-state">No saved resumes found. Add your first version on the left!</div>`;
            } else {
                resumeContainer.innerHTML = resumes.map(r => `
                    <div class="item-card">
                        <div class="item-header">
                            <div>
                                <div class="item-title">${escapeHtml(r.title)}</div>
                                <div class="item-subtitle">Target: ${escapeHtml(r.target)}</div>
                            </div>
                            <button class="btn btn-danger" onclick="deleteResume(${r.id})">Delete</button>
                        </div>
                        <div class="item-meta">Saved on: ${r.date}</div>
                        <div class="item-desc">${escapeHtml(r.content)}</div>
                    </div>
                `).join('');
            }

            // Render Accomplishments
            const accContainer = document.getElementById('accomplishment-list');
            if (accomplishments.length === 0) {
                accContainer.innerHTML = `<div class="empty-state">No accomplishments tracked yet. Start logging your wins!</div>`;
            } else {
                accContainer.innerHTML = accomplishments.map(a => `
                    <div class="item-card">
                        <div class="item-header">
                            <div>
                                <span class="tag">${escapeHtml(a.category)}</span>
                                <div class="item-title" style="margin-top: 0.25rem;">${escapeHtml(a.title)}</div>
                            </div>
                            <button class="btn btn-danger" onclick="deleteAccomplishment(${a.id})">Delete</button>
                        </div>
                        <div class="item-meta">Period: ${escapeHtml(a.date)}</div>
                        <div class="item-desc">${escapeHtml(a.desc)}</div>
                    </div>
                `).join('');
            }
        }

        // Basic XSS safety utility
        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Initial paint
        render();
    </script>
</body>
</html>
